services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./storage:/root/storage
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:v1.4.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-network

networks:
  app-network:

volumes:
  qdrant_data:
